<head>

  <style>
    :root{--bg:#1a1a1a;--surface:#262626;--surface-alt:#303030;--border:#404040;--text:#f7f4ea;--sub:#d6d1bf;--muted:#b4ad99;--accent:#f3de8a;--accent-deep:#cdbb63}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;display:flex;flex-direction:column}
    a{color:inherit}
    header{padding:24px 8%;border-bottom:1px solid #3a3a3a;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
    .logo{font-size:22px;font-weight:800;letter-spacing:-1px;color:#fff;text-decoration:none;white-space:nowrap}
    .logo span,.eyebrow{color:var(--accent)}
    nav{display:flex;align-items:center;gap:25px;flex-wrap:wrap}
    nav a{color:var(--sub);text-decoration:none;font-size:13px;font-weight:600;transition:color .2s}
    nav a:hover,nav a:focus-visible{color:var(--accent)}
    a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
    main{width:100%;max-width:1240px;margin:auto;padding:85px 30px 95px;flex:1;display:flex;align-items:center}
    .hero{width:100%;display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,.96fr);gap:52px;align-items:center}
    .eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;line-height:1.5}
    h1{font-size:clamp(43px,5.2vw,66px);letter-spacing:-2.8px;line-height:1.12;margin:20px 0 23px}
    h1 span{color:var(--accent)}
    .intro{max-width:490px;font-size:15px;color:var(--sub);line-height:1.85;margin:0 0 30px}
    .buttons{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .button{display:inline-flex;justify-content:center;align-items:center;gap:13px;padding:14px 20px;background:var(--accent-deep);border:1px solid var(--accent-deep);border-radius:7px;text-decoration:none;font-size:13px;font-weight:700;color:#1a1a1a;transition:background .2s,border-color .2s,transform .2s}
    .button:hover{background:var(--accent);border-color:var(--accent);transform:translateY(-2px)}
    .subtle-link{text-decoration:none;font-size:12px;color:var(--sub);font-weight:600;padding:13px}
    .subtle-link:hover{color:var(--accent)}
    .preview{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:23px 24px 20px;min-width:0}
    .preview-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
    .preview-label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1.3px}
    .chip{font-size:10px;color:var(--accent);font-weight:700;background:#4a4330;padding:6px 9px;border-radius:5px;white-space:nowrap}
    .preview h2{font-size:18px;letter-spacing:-.5px;margin:6px 0 5px}
    .preview p{font-size:12px;color:var(--sub);margin:0 0 6px;line-height:1.7}
    .error-art{height:235px;position:relative;margin:22px 0 15px;display:flex;align-items:center;justify-content:center;border:1px solid #3b3b3b;border-radius:7px;overflow:hidden;background:#202020}
    .error-art svg{position:absolute;inset:0;width:100%;height:100%}
    .error-code{position:relative;z-index:1;font-size:clamp(82px,12vw,132px);font-weight:800;letter-spacing:-9px;color:var(--accent);line-height:1;text-shadow:0 5px 40px #1a1a1a}
    .preview-footer{border-top:1px solid #454545;padding-top:15px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .preview-key{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--sub)}
    .preview-key:before{content:"";width:15px;height:3px;background:var(--accent);border-radius:5px}
    .preview-footer a{font-size:11px;font-weight:700;color:var(--accent);text-decoration:none}
    .preview-footer a:hover{text-decoration:underline}
    footer{border-top:1px solid #3a3a3a;padding:24px;text-align:center;color:var(--muted);font-size:12px}
    @media(max-width:800px){main{padding:58px 25px 76px}.hero{grid-template-columns:1fr;gap:38px}h1{font-size:clamp(38px,7vw,58px)}.preview{max-width:640px}}
    @media(max-width:550px){header{padding:20px 6%}nav{gap:18px}main{padding:47px 20px 65px}h1{font-size:41px;letter-spacing:-1.8px}.preview{padding:18px}.error-art{height:205px}.error-code{font-size:96px;letter-spacing:-6px}}
    @media(prefers-reduced-motion:reduce){.button,nav a{transition:none}}
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo" aria-label="ScatterBench home">Scatter<span>Bench</span></a>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="graphs.html">Graphs</a>
      <a href="https://discord.gg/VrHx9UgXsH" target="_blank" rel="noopener noreferrer">Discord ↗</a>
    </nav>
  </header>
  <main>
    <section class="hero" aria-labelledby="error-title">
      <div>
        <div class="eyebrow">ERROR / 404</div>
        <h1 id="error-title">Page not<br><span>found.</span></h1>
        <p class="intro">Either this page has been removed or does not exist yet</p>
        <div class="buttons">
          <a class="button" href="index.html">Return home <span aria-hidden="true">↗</span></a>
          <a class="subtle-link" href="graphs.html">Explore benchmarks ↗</a>
        </div>
      </div>
      <div class="preview" aria-label="404 error illustration">
        <div class="preview-head">
          <span class="preview-label">PAGE STATUS</span>
          <span class="chip">NOT FOUND</span>
        </div>
        <h2>Nothing to display</h2>
        <p>The requested page could not be located.</p>
        <div class="error-art" aria-hidden="true">
          <svg viewBox="0 0 500 240" preserveAspectRatio="none" focusable="false">
            <defs><pattern id="grid" width="50" height="40" patternUnits="userSpaceOnUse"><path d="M50 0H0V40" fill="none" stroke="#414141" stroke-width="1"/></pattern></defs>
            <rect width="500" height="240" fill="url(#grid)"/>
            <path d="M0 183L50 175L93 188L140 143L189 161L232 128L277 152L325 122L370 141L409 105L447 124L500 92" fill="none" stroke="#6d6549" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 9" opacity=".65"/>
          </svg>
          <span class="error-code">404</span>
        </div>
        <div class="preview-footer">
          <span class="preview-key">Page unavailable</span>
          <a href="index.html">Back to home ↗</a>
        </div>
      </div>
    </section>
  </main>
  <script>
(function(){
'use strict';
const favicon=document.getElementById('site-favicon');
const preferred=favicon.getAttribute('data-image')||'';
const names=[preferred];
if(/^scatterbench2\.(?:png|jpe?g|webp|svg|ico)$/i.test(preferred)){
  for(const ext of ['png','jpg','jpeg','webp','svg','ico'])names.push('scatterbench2.'+ext);
}
const candidates=[...new Set(names)].filter(Boolean);
function probe(i){
 if(i>=candidates.length)return;
 const test=new Image();
 test.onload=function(){
    const name=candidates[i];
    favicon.href=name;
    const ext=name.split('.').pop().toLowerCase();
    favicon.type=ext==='svg'?'image/svg+xml':ext==='webp'?'image/webp':ext==='png'?'image/png':ext==='ico'?'image/x-icon':'image/jpeg';
 };
 test.onerror=function(){probe(i+1);};
 test.src=candidates[i];
}
probe(0);
})();
  </script>
</body>
</html>
